name: Tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', 'uv.lock', '.github/workflows/tests.yml', 'scripts/runtime/**']
  pull_request:
permissions:
  contents: read
jobs:
  minimal-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install uv==0.11.16
      - name: Install active runtime only
        run: uv sync --locked
      - name: Verify active entrypoints without legacy dependencies
        run: |
          .venv/bin/agent-trader --help
          .venv/bin/python -m agent_trader --help
          .venv/bin/python - <<'PY'
          import importlib
          import importlib.util
          import pkgutil
          import agent_trader.runtime

          for name in ("anthropic", "openai", "alpaca", "yfinance", "pandas", "ta", "rich", "pydantic_settings"):
              assert importlib.util.find_spec(name) is None, name
          for module in pkgutil.iter_modules(agent_trader.runtime.__path__, "agent_trader.runtime."):
              if not module.ispkg:
                  importlib.import_module(module.name)
          PY
      - name: Install runtime test tools
        run: uv sync --locked --extra dev
      - name: Runtime tests without legacy shared fixtures
        run: .venv/bin/python -m pytest --confcutdir=tests/runtime tests/runtime -q
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install uv==0.11.16
      - name: Install locked dependencies
        run: uv sync --locked --extra dev --extra legacy
      - name: Runtime and legacy regression tests
        run: .venv/bin/python -m pytest tests -q
      - name: Lint active runtime
        run: .venv/bin/ruff check src/agent_trader/runtime src/agent_trader/strategies
      - name: Check JavaScript
        run: node --check src/agent_trader/runtime/web/app.js
