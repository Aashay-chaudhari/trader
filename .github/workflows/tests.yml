name: Tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'pyproject.toml', '.github/workflows/tests.yml', 'scripts/runtime/**']
  pull_request:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install uv==0.11.16
      - name: Install locked dependencies
        run: uv sync --locked --extra dev
      - name: Runtime and legacy regression tests
        run: .venv/bin/python -m pytest tests -q
      - name: Lint active runtime
        run: .venv/bin/ruff check src/agent_trader/runtime src/agent_trader/strategies
      - name: Check JavaScript
        run: node --check src/agent_trader/runtime/web/app.js
