name: Verify Alpaca Paper Account

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Read-only paper account check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      - name: Verify configured paper account
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_CODEX || secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_CODEX || secrets.ALPACA_SECRET_KEY }}
        run: |
          test -n "$ALPACA_API_KEY" || { echo "Missing Alpaca API key secret"; exit 1; }
          test -n "$ALPACA_SECRET_KEY" || { echo "Missing Alpaca secret key secret"; exit 1; }
          python - <<'PY'
          from alpaca.trading.client import TradingClient
          from alpaca.trading.enums import QueryOrderStatus
          from alpaca.trading.requests import GetOrdersRequest
          import os

          client = TradingClient(
              api_key=os.environ["ALPACA_API_KEY"],
              secret_key=os.environ["ALPACA_SECRET_KEY"],
              paper=True,
          )
          account = client.get_account()
          positions = client.get_all_positions()
          orders = client.get_orders(GetOrdersRequest(status=QueryOrderStatus.OPEN))
          account_number = str(account.account_number)

          print("Alpaca paper connection successful")
          print(f"account=***{account_number[-4:]}")
          print(f"status={account.status}")
          print(f"cash={account.cash}")
          print(f"equity={account.equity}")
          print(f"buying_power={account.buying_power}")
          print(f"open_positions={len(positions)}")
          print(f"open_orders={len(orders)}")

          if positions or orders:
              raise SystemExit("Account is reachable but is not empty.")
          PY
